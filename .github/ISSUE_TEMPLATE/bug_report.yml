name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems (leaked logins, one channel posting as another, the unattended maker escaping its folder) go through private reporting instead: Security tab → Report a vulnerability.
        Never paste tokens, `.env` contents or login files. Check logs before you paste them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead. Paste the exact error.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run shorts -- --channel my-channel make …
        2. …
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "macOS 15.x, Apple M-series, Node 22.x, commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Making videos (make, render, styles, motion kit)
        - Channels, templates, briefs
        - Stories, claims, feeds
        - Instagram posting / autopilot
        - YouTube kits / publish
        - Audio library / photos
        - Film QA
        - Docs
        - Other
