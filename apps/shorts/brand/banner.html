<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
:root{--bg:#0D0C12;--fg:#F4F1EC;--muted:#8B8794;--hot:#FFB020;--warm:#FF3D2E}
*{margin:0;box-sizing:border-box}
html,body{width:2560px;height:1440px;background:var(--bg);overflow:hidden;font-family:'Space Grotesk',sans-serif;color:var(--fg)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:80px 80px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.rings{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.rings i{position:absolute;left:50%;top:50%;border:3px solid rgba(255,255,255,.05);border-radius:50%;transform:translate(-50%,-50%)}
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;gap:64px;padding:0 40px}
.mark{width:360px;height:360px;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 0 120px rgba(255,90,31,.35)}
.mark svg{width:100%;height:100%}
h1{font-size:150px;font-weight:700;letter-spacing:-4px;line-height:.95}
h1 b{background:linear-gradient(90deg,var(--hot),var(--warm));-webkit-background-clip:text;color:transparent}
p{font-size:44px;font-weight:500;color:var(--fg);opacity:.92;margin-top:22px;letter-spacing:-.5px}
.chips{display:flex;gap:16px;margin-top:28px;font-family:'JetBrains Mono',monospace;font-size:26px;color:var(--muted)}
.chips span{border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 22px}
.chips .live{color:var(--hot);border-color:rgba(255,176,32,.45)}
.chips .live:before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--hot);margin-right:12px;vertical-align:2px;box-shadow:0 0 14px var(--hot)}
.glow{position:absolute;left:640px;top:520px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,31,.18),transparent 65%)}
</style></head><body>
<div class="grid"></div>
<div class="rings"><i style="width:1300px;height:1300px"></i><i style="width:2000px;height:2000px"></i><i style="width:2700px;height:2700px"></i></div>
<div class="glow"></div>
<div class="safe">
  <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><defs><linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FF3D2E"/><stop offset="1" stop-color="#FFB020"/></linearGradient></defs><rect width="800" height="800" fill="url(#bg)"/><!-- radar waves from the launch point (bottom-left) --><g fill="none" stroke="#0D0C12" stroke-width="30" stroke-linecap="round"><circle cx="225" cy="575" r="26" fill="#0D0C12" stroke="none"/><path d="M 225 470 A 105 105 0 0 1 330 575" opacity="0.85"/><path d="M 225 385 A 190 190 0 0 1 415 575" opacity="0.5"/></g><g transform="translate(470 330) rotate(45) scale(0.9)"><path d="M0 -240 C 80 -170 100 -60 90 60 L -90 60 C -100 -60 -80 -170 0 -240 Z" fill="#F4F1EC"/><circle cx="0" cy="-80" r="40" fill="#0D0C12"/><path d="M-88 -10 C -140 20 -165 70 -165 130 L -88 85 Z" fill="#0D0C12"/><path d="M88 -10 C 140 20 165 70 165 130 L 88 85 Z" fill="#0D0C12"/><path d="M-48 78 L48 78 L30 120 L-30 120 Z" fill="#0D0C12"/></g></svg></div>
  <div>
    <h1>LAUNCH <b>RADAR</b></h1>
    <p>Today's best new launches, in 30 seconds.</p>
    <div class="chips"><span class="live">NEW SHORTS DAILY</span><span>SHOW HN</span><span>GITHUB</span><span>DEV TOOLS · AI</span></div>
  </div>
</div>
</body></html>
